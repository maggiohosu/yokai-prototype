<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#233e33" />
    <title>요괴 키우기 (미물에서 용까지)</title>
    <meta name="description" content="사방 들판에서 미물을 움직여 요괴를 먹고, 몸집을 키우고, 새로운 모습으로 진화하세요." />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/ui/overlay.css" />
    <link rel="stylesheet" href="./src/ui/quickpick.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="title-group">
        <span class="crest" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <h1>요괴 키우기</h1>
          <p>미물에서 용까지</p>
        </div>
      </div>
      <a id="nav-link" class="nav-link" href="./index.html?gallery=1"
        ><span class="book" aria-hidden="true"></span><span id="nav-text">요괴 도감</span></a
      >
    </header>
    <main id="arena" aria-label="사방 들판 게임 화면">
      <div id="phaser-host"></div>
      <section class="hud" aria-label="플레이 현황">
        <div class="identity">
          <span id="avatar-slot" class="portrait"></span>
          <div><small>1단계</small><strong>미물</strong></div>
        </div>
        <div class="stat"><small>현재 크기</small><strong id="size"></strong></div>
        <div class="stat"><small>먹은 수</small><strong id="eaten">0</strong></div>
        <div class="growth-gauge" id="growth-gauge" hidden>
          <label for="growth-meter">다음 성장까지</label>
          <progress id="growth-meter" value="0" max="1"></progress>
          <span id="growth-count" aria-hidden="true"></span>
        </div>
      </section>
      <div class="field-size" aria-hidden="true"><span>현재 크기</span><strong id="field-size"></strong></div>
      <div class="field-atlas">
        <aside class="mini" aria-label="현재 위치">
          <div class="mini-title">사방 지도</div>
          <canvas id="map" aria-label="사방 구역과 플레이어의 위치"></canvas>
          <div class="location"><span id="region-seal"></span><span id="area"></span></div>
        </aside>
        <a class="field-book" href="./index.html?gallery=1"><span class="book" aria-hidden="true"></span>도감</a>
      </div>
      <div class="movement-control"><div id="joystick" aria-hidden="true"><i>이동</i></div></div>
      <div class="help">
        <span class="keys">
          <span><kbd>WASD</kbd> 또는 방향키로 이동</span>
          <span><kbd>스페이스</kbd> 발사</span>
        </span>
      </div>
    </main>
    <main id="gallery" hidden>
      <div class="folio">
        <div class="folio-heading">
          <h2>요괴 도감</h2>
          <span id="form-count"></span>
        </div>
        <div id="filters" role="group" aria-label="방위별 보기"></div>
        <div id="cards"></div>
      </div>
    </main>
    <dialog id="rotate-guide" aria-labelledby="rotate-title" aria-describedby="rotate-help">
      <div class="rotate-sheet">
        <span class="rotate-phone" aria-hidden="true"></span>
        <h2 id="rotate-title">가로로 돌려 주세요</h2>
        <p id="rotate-help">왼손으로 이동하고 오른손으로 여의주를 쏘세요.</p>
        <button type="button" id="rotate-start">가로 화면 열기</button>
      </div>
    </dialog>
    <div id="loading" role="status">들판을 펼치는 중…</div>
    <noscript><div class="script-required">들판을 열려면 브라우저에서 JavaScript를 켜 주세요.</div></noscript>
    <dialog id="result" aria-labelledby="end-title" hidden>
      <div class="result-paper">
        <div class="result-record">
          <div class="result-heading">
            <span class="result-stamp" aria-hidden="true">終</span>
            <h2 id="end-title">판 종료</h2>
          </div>
          <p id="killer"></p>
          <p id="run-reward" class="run-reward" hidden></p>
          <dl>
            <div>
              <dt>먹은 수</dt>
              <dd id="final-eaten"></dd>
            </div>
            <div>
              <dt>최대 크기</dt>
              <dd id="final-size"></dd>
            </div>
          </dl>
        </div>
        <div class="result-actions">
          <button id="restart" type="button" autofocus>다음 판 시작</button>
          <button id="hub" type="button">강화와 진화</button>
          <a href="./index.html?gallery=1">요괴 도감</a>
        </div>
      </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
