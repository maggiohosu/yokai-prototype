<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#263e35" />
    <title>요괴 키우기 · 미물에서 용까지</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/ui/overlay.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="title-group">
        <span class="crest" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <h1>요괴 키우기</h1>
          <p>미물에서 용까지</p>
        </div>
      </div>
      <a id="nav-link" class="nav-link" href="./index.html?gallery=1"
        ><span class="book" aria-hidden="true"></span><span id="nav-text">요괴 도감</span></a
      >
    </header>
    <main id="arena" aria-label="사방 들판 게임 화면">
      <div id="phaser-host"></div>
      <section class="hud" aria-label="플레이 현황">
        <div class="identity">
          <span class="portrait"><img id="avatar" alt="" /></span>
          <div><small>1단계</small><strong>미물</strong></div>
        </div>
        <div class="stat"><small>현재 크기</small><strong id="size">–</strong></div>
        <div class="stat"><small>먹은 수</small><strong id="eaten">0</strong></div>
      </section>
      <aside class="mini" aria-label="현재 위치">
        <div class="mini-title"><span class="compass" aria-hidden="true">✦</span> 사방 지도</div>
        <canvas id="map" aria-label="사방 구역과 플레이어의 위치"></canvas>
        <div class="location"><span id="region-seal"></span><span id="area"></span></div>
      </aside>
      <div class="help">
        <span class="keys"
          ><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>또는</span><kbd>↑</kbd><kbd>←</kbd
          ><kbd>↓</kbd><kbd>→</kbd> 이동</span
        ><span class="touch-help">왼쪽 화면을 끌어 이동</span>
      </div>
    </main>
    <main id="gallery" hidden>
      <div class="folio">
        <div class="folio-heading">
          <h2>요괴 도감</h2>
          <span id="form-count"></span>
        </div>
        <div id="filters" role="group" aria-label="방위별 보기"></div>
        <div id="cards"></div>
      </div>
    </main>
    <div id="joystick" aria-hidden="true" hidden><i></i></div>
    <div id="loading" role="status">들판을 펼치는 중…</div>
    <section id="result" role="dialog" aria-modal="true" aria-labelledby="end-title" hidden>
      <div class="result-paper">
        <span class="result-stamp" aria-hidden="true">終</span>
        <h2 id="end-title">판 종료</h2>
        <p id="killer"></p>
        <dl>
          <div>
            <dt>먹은 수</dt>
            <dd id="final-eaten"></dd>
          </div>
          <div>
            <dt>최대 크기</dt>
            <dd id="final-size"></dd>
          </div>
        </dl>
        <button id="restart" type="button">정비하러 가기 <span aria-hidden="true">→</span></button>
        <a href="./index.html?gallery=1">요괴 도감</a>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
